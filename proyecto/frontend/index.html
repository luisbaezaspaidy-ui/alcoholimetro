<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AlcoSafe - Iniciar Sesión</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="fondo-pantalla d-flex justify-content-center align-items-center min-vh-100">

    <div class="contenedor-principal shadow-lg p-4 rounded-4 w-100">
        
        <header class="encabezado d-flex justify-content-between align-items-center p-3 rounded-3 mb-4">
            <div>
                <h1 class="titulo m-0 fs-3">AlcoSafe</h1>
                <small class="subtitulo">Sistema de Alcoholímetro</small>
            </div>
            <div class="imagen-contenedor">
                <span class="icono-auto">🚗</span>
            </div>
        </header>

        <div id="alerta-exito" class="alert alert-success d-none py-2 text-center" role="alert">
            ¡Cuenta creada con éxito! Ya puedes iniciar sesión.
        </div>

        <div id="alerta-error" class="alert alert-danger d-none py-2 text-center" role="alert">
            Correo o contraseña incorrectos. Inténtalo de nuevo.
        </div>

        <form id="formulario" class="cuerpo-formulario" action="/login" method="POST">
            
            <div class="grupo-entrada mb-3">
                <label for="correo" class="form-label fw-bold">Usuario / Correo electrónico:</label>
                <input type="email" id="correo" name="correo" class="form-control entrada-texto" placeholder="ejemplo@alcosafe.com">
            </div>

            <div class="grupo-entrada mb-4">
                <label for="contrasena" class="form-label fw-bold">Contraseña:</label>
                <input type="password" id="contrasena" name="contrasena" class="form-control entrada-texto" placeholder="••••••••">
            </div>

            <div class="botones d-flex gap-3 justify-content-center">
                <button type="reset" class="btn btn-limpiar px-4 py-2">Limpiar</button>
                <button type="submit" class="btn btn-registrar px-4 py-2 flex-grow-1">Ingresar</button>
            </div>

        </form>

        <hr class="my-4">

        <div class="text-center">
            <span class="text-muted small">¿Eres conductor y no tienes cuenta?</span>
            <a href="registro.html" class="enlace-registro fw-bold text-decoration-none d-block mt-1">Crear una cuenta nueva</a>
        </div>
    </div>

    <script src="js/script.js"></script>
</body>
</html>
