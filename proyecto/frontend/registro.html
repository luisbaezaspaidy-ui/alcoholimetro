<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AlcoSafe - Crear Cuenta</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/registro.css">
</head>
<body class="fondo-pantalla d-flex justify-content-center align-items-center min-vh-100">

    <div class="contenedor-registro shadow-lg p-4 rounded-4 w-100">
        
        <header class="encabezado-registro d-flex justify-content-between align-items-center p-3 rounded-3 mb-4">
            <div>
                <h1 class="titulo m-0 fs-3">Registro AlcoSafe</h1>
                <small class="subtitulo">Crea tu cuenta de conductor</small>
            </div>
            <div class="imagen-contenedor">
                <span class="icono-usuario">👤</span>
            </div>
        </header>

        <div id="alerta-registro-error" class="alert alert-danger d-none py-2 text-center" role="alert">
            Ese correo ya está registrado o los datos son inválidos.
        </div>

        <form id="form-registro" class="cuerpo-formulario" action="/registro-usuario" method="POST">
            
            <div class="grupo-entrada mb-3">
                <label for="nombre" class="form-label fw-bold">Nombre completo:</label>
                <input type="text" id="nombre" name="nombre" class="form-control entrada-texto" placeholder="Ej. Carlos Méndez">
            </div>

            <div class="grupo-entrada mb-3">
                <label for="correo" class="form-label fw-bold">Correo electrónico:</label>
                <input type="email" id="correo" name="correo" class="form-control entrada-texto" placeholder="carlos@correo.com">
            </div>

            <div class="grupo-entrada mb-4">
                <label for="contrasena" class="form-label fw-bold">Contraseña:</label>
                <input type="password" id="contrasena" name="contrasena" class="form-control entrada-texto" placeholder="Mínimo 4 caracteres">
            </div>

            <div class="botones d-flex gap-3 justify-content-center">
                <a href="index.html" class="btn btn-volver px-4 py-2 text-decoration-none">Volver</a>
                <button type="submit" class="btn btn-crear px-4 py-2 flex-grow-1">Registrarme</button>
            </div>

        </form>
    </div>

    <script src="js/registro.js"></script>
</body>
</html>
